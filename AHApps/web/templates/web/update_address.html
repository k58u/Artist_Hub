{% block web %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-4">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <img src="{{ profile.profile.url }}" alt="avatar" class="rounded-circle img-fluid"
                         style="width: 150px;">
                    <h5 class="my-3">{{ profile.first_name|title }} {{ profile.last_name|title }}</h5>
                    <p class="text-muted mb-1">{{ profile.artist_id.artist_id }}</p>
                    <p class="text-muted mb-4" id="address-text">{{ profile.address }}</p>
                    <div class="d-flex justify-content-center mb-2">
                        <!-- Button to Edit Address -->
                        <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#editAddressModal">
                            Edit Address
                        </button>
                        <a href="{% url 'logout' %}" class="btn btn-outline-danger ms-1">Logout</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-body">
                    <!-- Other profile information -->
                    <div class="row">
                        <div class="col-sm-3">
                            <p class="mb-0">Address</p>
                        </div>
                        <div class="col-sm-9">
                            <p class="text-muted mb-0" id="address-display">{{ profile.address }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Address Modal -->
<div class="modal fade" id="editAddressModal" tabindex="-1" aria-labelledby="editAddressModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editAddressModalLabel">Edit Address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'update_address' %}" method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3 text-start">
                        <label for="new-address" class="form-label">Address</label>
                        <textarea class="form-control" id="new-address" name="address" rows="3">{{ profile.address }}</textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-dark">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
