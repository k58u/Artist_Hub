{% extends 'web/auth_base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block styles %}
<style>
    body {
        background: url('{% static "images/login__.jpg" %}') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .login-container {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        padding: 2rem;
        max-width: 380px;
        width: 100%;
        text-align: center;
    }

    .login-container img {
        margin-bottom: 1rem;
    }

    .login-container h2 {
        font-weight: bold;
        color: #333;
        margin-bottom: 1.5rem;
    }

    .form-control {
        border-radius: 20px;
        padding: 10px 15px;
    }

    .btn-login {
        background-color: #764ba2;
        color: #fff;
        border-radius: 20px;
        padding: 10px;
        font-size: 16px;
        width: 100%;
    }

    .btn-login:hover {
        background-color: #5a3b86;
    }

    .links {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
    }

    .links a {
        color: #764ba2;
        font-size: 14px;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block auth %}
<div class="login-container">
    <img src="{% static 'images/logo.png' %}" height="80px" alt="Logo">
    <h2>Login</h2>

    {% if messages %}
    {% for message in messages %}
    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'info' %}alert-info{% endif %}" role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" class="form-control" id="artist_id" name="artist_id" placeholder="Artist ID (AH000...)" required>
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-login">Login</button>
        <div class="links">
            <a href="{% url 'forgot_password_view' %}">Forgot password?</a>
            <a href="{% url 'register_view' %}">New user?</a>
        </div>
    </form>
</div>
{% endblock %}
